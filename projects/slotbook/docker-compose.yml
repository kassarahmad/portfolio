# Local development stack: PostgreSQL 16 + the API.
#   cp .env.example .env    (then set JWT_SECRET and PGPASSWORD)
#   docker compose up --build
# The database is published on 127.0.0.1 only, never on all interfaces.
# For production, see ../shipyard (reverse proxy, TLS, backups).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-slotbook}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:-slotbook}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    init: true # reaps zombies and forwards signals to node
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: "5432"
      NODE_ENV: development
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
